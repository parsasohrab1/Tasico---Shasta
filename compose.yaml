services:
  api:
    build:
      context: .
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      AUTH_USERS_JSON: ${AUTH_USERS_JSON:?Set AUTH_USERS_JSON with bcrypt hashes in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
