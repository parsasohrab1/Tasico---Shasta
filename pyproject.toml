[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasico-shasta"
version = "0.1.0"
description = "Secure, testable energy optimization service for Tasico Shasta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7.4,<2",
  "pydantic>=2.6,<3",
  "pandas>=2.0,<4",
  "numpy>=1.24,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "PuLP>=2.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
tasico = "tasico_shasta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
